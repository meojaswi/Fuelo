services:
  postgres:
    image: postgres:16
    environment:
      POSTGRES_DB: fuelo
      POSTGRES_USER: fuelo
      POSTGRES_PASSWORD: ${FUELO_POSTGRES_PASSWORD:?Set FUELO_POSTGRES_PASSWORD for local development}
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - fuelo-postgres:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U fuelo -d fuelo"]
      interval: 2s
      timeout: 3s
      retries: 15

volumes:
  fuelo-postgres:
