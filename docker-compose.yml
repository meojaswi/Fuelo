services:
  postgres:
    image: postgres:16
    environment:
      POSTGRES_DB: fuelo
      POSTGRES_USER: fuelo
      POSTGRES_PASSWORD: ${FUELO_POSTGRES_PASSWORD:?Set FUELO_POSTGRES_PASSWORD for local development}
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - fuelo-postgres:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U fuelo -d fuelo"]
      interval: 2s
      timeout: 3s
      retries: 15

  migrate:
    build: ./backend
    command: ["npm", "run", "migrate"]
    environment:
      DATABASE_URL: postgresql://fuelo:${FUELO_POSTGRES_PASSWORD}@postgres:5432/fuelo
    depends_on:
      postgres:
        condition: service_healthy
    restart: "no"

  backend:
    build: ./backend
    env_file:
      - path: ./backend/.env
        required: false
    environment:
      NODE_ENV: production
      PORT: "8000"
      DATABASE_URL: postgresql://fuelo:${FUELO_POSTGRES_PASSWORD}@postgres:5432/fuelo
      JWT_SECRET: ${JWT_SECRET:?Set JWT_SECRET (32+ characters)}
      CORS_ORIGINS: ${CORS_ORIGINS:-http://localhost:5173}
      PUBLIC_APP_URL: ${PUBLIC_APP_URL:-http://localhost:5173}
    ports:
      - "127.0.0.1:8000:8000"
    depends_on:
      migrate:
        condition: service_completed_successfully
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:8000/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 5s
      timeout: 3s
      retries: 10

  frontend:
    build:
      context: ./frontend
      args:
        VITE_API_BASE_URL: ${VITE_API_BASE_URL:-http://localhost:8000/api}
    ports:
      - "127.0.0.1:5173:80"
    depends_on:
      backend:
        condition: service_healthy

volumes:
  fuelo-postgres:
